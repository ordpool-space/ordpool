<!-- HACK: Ordpool family strip (sits above app-global-footer) -->
<section class="family-footer" aria-labelledby="family-footer-heading">
  <div class="family-inner">

    <header class="family-head">
      <h2 id="family-footer-heading" class="family-heading">
        <img src="/resources/ordpool-cube-logo.svg" width="22" height="22" alt="" class="family-mark">
        {{ heading }}
      </h2>
      <p class="family-lede">{{ lede }}</p>
    </header>

    <ul class="family-grid">
      <li *ngFor="let member of members" class="family-member" [class.is-current]="isCurrent(member)">

        <ng-container *ngIf="isCurrent(member); else linkedMember">
          <div class="member-body">
            <span class="member-name">
              {{ member.name }}
              <span class="you-are-here">You’re here</span>
            </span>
            <span class="member-line">{{ member.line }}</span>
          </div>
        </ng-container>

        <!-- The WHOLE card is the link, not just the name, so the entire card
             is a single click target. -->
        <ng-template #linkedMember>
          <a class="member-body member-link" [href]="member.url" target="_blank" rel="noopener">
            <span class="member-name">{{ member.name }}<span class="member-go" aria-hidden="true">→</span></span>
            <span class="member-line">{{ member.line }}</span>
          </a>
        </ng-template>

      </li>
    </ul>

  </div>
</section>
