name: Check locktime framing

# Fails the build if any banned "nLockTime=21 orphans the cat" style
# phrase appears in tracked source/tests/docs. See workspace HQ HARD
# RULE "nLockTime=21 is PROTOCOL for MINT, CONVENTION for everything
# else" and scripts/check-locktime-framing.sh for the full list.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, stage_prod ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run locktime-framing guard
        run: scripts/check-locktime-framing.sh
