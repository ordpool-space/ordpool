name: E2E (regtest mint — cat21-wallet)

# CAT-21 wallet variant of the regtest mint suite. Runs as a separate
# workflow so the two wallets can iterate independently and CI signal
# stays cleanly attributed.
#
# Pipeline differs from the Xverse workflow in two material ways:
#   - No SDK globalSetup needed. CAT-21 wallet onboards inline in the
#     spec's `beforeAll` (BIP-39 mnemonic restore), so we skip the
#     "Run SDK's Xverse onboarding" + "Verify seed user-data-dir
#     landed" steps.
#   - We stage cat21wallet.crx instead of xverse.crx via the SDK
#     bootstrap (`playwright-bootstrap.sh cat21wallet`).
#
# The frontend stack-up + serve sequence is identical; the spec runs
# under the same playwright.regtest.config.ts but `--grep`-ed to the
# cat21wallet spec file so it doesn't co-execute with the Xverse spec.

on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * *'   # nightly at 03:47 UTC (30 min after Xverse run)
  push:
    paths:
      - 'frontend/e2e/regtest/cat21wallet-mint.e2e.spec.ts'
      - 'frontend/e2e/regtest/inscribe-mint-cat21wallet.e2e.spec.ts'
      - 'frontend/e2e/regtest/payment-address.ts'
      - '.github/workflows/e2e-regtest-mint-cat21wallet.yml'
      # An SDK pin bump changes the app bundle this page-driven spec boots,
      # so dep bumps must trigger it (matches the sibling mint lane).
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      # The regtest Playwright config (retries, timeouts) is load-bearing.
      - 'frontend/playwright.regtest.config.ts'
      # The page shell this spec boots. A change here (e.g. adding the
      # family-footer strip) alters the rendered page without touching the
      # component dirs below, so the shell must trigger the lane too.
      - 'frontend/src/app/components/master-page/**'
      # The page-driven components this spec boots. A template or formatting
      # change here (e.g. grouping the Fund address into chunks) breaks the
      # spec WITHOUT touching its file, and frontend/src/** is deliberately
      # excluded as too broad. Scope to just the mint / wallet-connect
      # surfaces the spec interacts with. Same blind spot that let a
      # Fund-address format change land unverified (dcd30a56e).
      # MAINTENANCE: extend this list when the spec boots another _ordpool
      # component, or the same silent-drift break returns for it.
      - 'frontend/src/app/components/_ordpool/cat21-mint/**'
      # The funding scan-port token the mint and inscribe components inject.
      - 'frontend/src/app/services/ordinals/sdk-tokens.ts'
      - 'frontend/src/app/components/_ordpool/wallet-connect/**'

permissions:
  contents: read

concurrency:
  group: ordpool-e2e-regtest-mint-cat21wallet-${{ github.ref }}
  cancel-in-progress: false

# Harden installs against transient registry blips like ECONNRESET: retry more
# times over a longer backoff window than npm's default of 2. npm and pnpm both
# read these npm_config_* values.
env:
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"
  npm_config_fetch_timeout: "600000"

jobs:
  regtest-mint-cat21wallet:
    name: Bring up stack + cat21-wallet round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Every wallet browser writes Chrome's net log here (launchWalletContext);
      # the net-log check after the specs fails on any request that left the
      # machine.
      ORDPOOL_E2E_NET_LOG_DIR: ${{ github.workspace }}/net-log
    steps:
      - name: Checkout ordpool
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend npm deps (brings ordpool-sdk into node_modules)
        run: npm ci
        working-directory: frontend

      # The stack runs in a machine-wide slot (ordpool-sdk e2e/README.md,
      # "Slots"): every host port, the compose prefix and the container names
      # the helpers docker exec into come from it, and land in GITHUB_ENV for
      # every later step. The runner's worker process ($PPID) holds the slot
      # for the whole job; the teardown step releases it.
      - name: Acquire a regtest stack slot
        working-directory: frontend
        run: node node_modules/ordpool-sdk/scripts/e2e-slots.mjs acquire --kind consumer --owner-pid "$PPID" --format github >> "$GITHUB_ENV"

      - name: Make SDK consumer-environment scripts executable
        run: chmod +x node_modules/ordpool-sdk/e2e/consumer-environment-bootstrap.sh
        working-directory: frontend

      # ordpool-electrs, cat21-ord and cat21-wallet build from the shas the
      # pinned SDK was proven with (TESTING.md: CI builds exactly what is
      # pinned); the SDK's bootstrap fails under CI on a checkout at another sha.
      - name: Read the SDK's build pins
        working-directory: frontend
        run: grep -E '^[A-Z0-9_]+=' node_modules/ordpool-sdk/e2e/build-pins.env >> "$GITHUB_ENV"

      # OUR electrs. consumer-environment.yml builds the electrs service
      # from the ordpool-electrs fork (not the upstream mempool/electrs
      # image); ELECTRS_SRC points its build context at this checkout.
      - name: Checkout ordpool-electrs (for the electrs container)
        uses: actions/checkout@v4
        with:
          repository: ordpool-space/ordpool-electrs
          ref: ${{ env.ORDPOOL_ELECTRS_SHA }}
          path: ordpool-electrs

      # cat21-ord source for BOTH ord containers the mock-free inscribe scan
      # queries: cat21-ord (--index-cat21, cats) and ord-stock (same
      # binary WITHOUT --index-cat21, inscriptions/runes/sat_ranges).
      - name: Checkout cat21-ord (for the cat21-ord + ord-stock containers)
        uses: actions/checkout@v4
        with:
          repository: ordpool-space/cat21-ord
          ref: ${{ env.CAT21_ORD_SHA }}
          path: cat21-ord

      # buildx gha cache: reuse the compiled electrs image across runs
      # instead of recompiling Rust (~10 min) every run. A docker-container
      # builder + the Actions runtime env make type=gha work; the
      # .dockerignore excludes each checkout's volatile .git/ so the COPY
      # layer (and the compile beneath it) is stable and cache-hits.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Export GitHub Actions runtime for the gha cache backend
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Stabilise the electrs build context for layer caching
        run: printf '.git\ntarget\n' > ordpool-electrs/.dockerignore

      - name: Bring up consumer-environment (bitcoind + electrs + mariadb + cat21-ord + ord-stock)
        env:
          ELECTRS_SRC: ${{ github.workspace }}/ordpool-electrs
          CAT21_ORD_SRC: ${{ github.workspace }}/cat21-ord
        run: |
          frontend/node_modules/ordpool-sdk/e2e/consumer-environment-bootstrap.sh \
            --buildx-cache \
            --with-cat21-ord \
            --with-ord-stock \
            > stack.json
          cat stack.json

      - name: Start the fees + electrs HTTP+WS shim
        run: |
          cd frontend
          WS_ENABLED=1 \
            nohup node node_modules/ordpool-sdk/e2e/regtest/fees-electrs-stub.mjs > ../fees-stub.log 2>&1 &
          echo $! > ../fees-stub.pid
          cd ..
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:$E2E_FEES_STUB_PORT/healthz" >/dev/null 2>&1; then
              echo "fees-stub up"; break
            fi
            if [ "$i" = "30" ]; then
              echo "fees-stub never came up"; cat fees-stub.log || true; exit 1
            fi
            sleep 1
          done

      - name: Smoke-test stub endpoints
        run: |
          echo "--- fees/recommended"
          curl -fsS "http://localhost:$E2E_FEES_STUB_PORT/api/v1/fees/recommended"
          echo
          echo "--- blocks/tip/height (electrs)"
          curl -fsS "http://localhost:$E2E_FEES_STUB_PORT/api/blocks/tip/height"
          echo

      # The SDK harness (global-setup, seeded vault, .crx, compose) comes from the
      # same SDK sha as frontend/package-lock.json: CI builds exactly what is
      # pinned (TESTING.md), so a pin bump moves the harness with it.
      - name: Read the ordpool-sdk sha pinned in the lockfile
        id: sdk-pin
        working-directory: frontend
        run: echo "sha=$(node -p "require('./package-lock.json').packages['node_modules/ordpool-sdk'].resolved.split('#')[1]")" >> "$GITHUB_OUTPUT"

      - name: Checkout ordpool-sdk (for the cat21-wallet extension + bootstrap script)
        uses: actions/checkout@v4
        with:
          repository: ordpool-space/ordpool-sdk
          path: sdk
          ref: ${{ steps.sdk-pin.outputs.sha }}

      - name: Setup Node (sdk)
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: 'npm'
          cache-dependency-path: 'sdk/package-lock.json'

      - name: Install SDK deps + build
        working-directory: sdk
        run: |
          npm ci
          npm run build

      - name: Install Playwright system deps + Chromium
        working-directory: sdk
        run: npx playwright install --with-deps chromium

      # CAT-21 wallet doesn't ship a published .crx yet — its
      # `cat21:trusted-build` workflow is the canonical publisher but
      # hasn't produced a release on the `ordpool-space/cat21-wallet`
      # repo. So we build the extension from source in CI. cat21-wallet
      # is a public repo; checkout works without auth.
      - name: Checkout cat21-wallet (extension source)
        uses: actions/checkout@v4
        with:
          repository: ordpool-space/cat21-wallet
          path: cat21-wallet-src
          ref: ${{ env.CAT21_WALLET_SHA }}

      # Switch Node to whatever cat21-wallet's `.nvmrc` pins (currently
      # Node 22) so we match the wallet's own CI exactly. The previous
      # `Setup Node (sdk)` step left Node at 24.13.0 — below the
      # `^24.15.0` engine floor that `@angular/common@22.x` (pulled in
      # by the wallet's lockfile as a transitive peer of ordpool-sdk)
      # enforces. `pnpm install --frozen-lockfile` then refused to
      # proceed with `ERR_PNPM_UNSUPPORTED_ENGINE`. The wallet's own CI
      # never hit this because it uses `.nvmrc` → Node 22, which
      # satisfies Angular 22's `^22.22.3` floor.
      - name: Setup Node (cat21-wallet — match wallet's own CI)
        uses: actions/setup-node@v4
        with:
          node-version-file: 'cat21-wallet-src/.nvmrc'

      - name: Setup pnpm for cat21-wallet build
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Cache cat21-wallet pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: cat21wallet-pnpm-${{ hashFiles('cat21-wallet-src/pnpm-lock.yaml') }}
          restore-keys: |
            cat21wallet-pnpm-

      - name: Cache cat21-wallet extension dist
        id: cat21wallet-dist-cache
        uses: actions/cache@v4
        with:
          path: cat21-wallet-src/apps/extension/dist
          key: cat21wallet-dist-${{ hashFiles('cat21-wallet-src/pnpm-lock.yaml', 'cat21-wallet-src/apps/extension/**/*.ts', 'cat21-wallet-src/apps/extension/**/*.tsx', 'cat21-wallet-src/packages/**/*.ts') }}

      - name: Install cat21-wallet dependencies
        if: steps.cat21wallet-dist-cache.outputs.cache-hit != 'true'
        working-directory: cat21-wallet-src
        run: pnpm install --frozen-lockfile

      - name: Build cat21-wallet extension
        if: steps.cat21wallet-dist-cache.outputs.cache-hit != 'true'
        working-directory: cat21-wallet-src
        run: pnpm build:extension

      - name: Stage cat21-wallet extension via SDK bootstrap (LOCAL_DIST mode)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAT21_WALLET_LOCAL_DIST: ${{ github.workspace }}/cat21-wallet-src/apps/extension/dist
        working-directory: sdk
        run: bash e2e/playwright/playwright-bootstrap.sh cat21wallet

      # regtest-bootstrap.sh removed: consumer-environment-bootstrap.sh (run
      # earlier) is a strict superset - same funder identity, same 101-block
      # funding, nothing reads its output. Running both merged into one bitcoind
      # by accident; once the compose project derives from E2E_PREFIX they
      # collide on the bitcoind RPC port. The cat21-wallet mint spec mocks /output and
      # verifies via Cat21ParserService, so it needs no ord - only the consumer
      # environment's bitcoind + electrs.
      - name: Generate frontend config (Ordpool defaults)
        working-directory: frontend
        run: npm run config:defaults:ordpool

      - name: Patch environment.ts to localhost absolute URLs
        working-directory: frontend
        run: |
          sed -i \
            -e "s|apiBaseUrl: ''|apiBaseUrl: 'http://localhost:${E2E_FEES_STUB_PORT}'|" \
            -e "s|websocketBaseUrl: ''|websocketBaseUrl: 'ws://localhost:${E2E_FEES_STUB_PORT}'|" \
            -e "s|cat21BaseUrl: 'http://localhost:3333'|cat21BaseUrl: 'http://localhost:${E2E_FEES_STUB_PORT}'|" \
            -e "s|'https://ord.ordpool.space'|'http://localhost:${E2E_ORD_STOCK_HOST_PORT}'|" \
            -e "s|'https://ordinals.unisat.io'|'http://localhost:${E2E_ORD_STOCK_HOST_PORT}'|" \
            -e "s|cat21OrdBaseUrl: 'https://ord.cat21.space'|cat21OrdBaseUrl: 'http://localhost:${E2E_ORD_HOST_PORT}'|" \
            src/environments/environment.ts

      - name: Patch bitcoinNetwork to Regtest
        working-directory: frontend
        run: |
          sed -i \
            -e 's|useValue: Network\.Mainnet|useValue: Network.Regtest|' \
            src/app/app.module.ts
          grep -n bitcoinNetwork src/app/app.module.ts | head -2

      - name: Build static frontend bundle
        working-directory: frontend
        run: |
          set -o pipefail
          npm run ng -- build --output-path ../dist-regtest 2>&1 | tee ../build.log

      - name: Locate the built browser output
        run: |
          for candidate in \
              dist-regtest \
              dist-regtest/browser \
              $(find dist-regtest -maxdepth 3 -type d -name browser); do
            if [ -f "$candidate/index.html" ]; then
              BROWSER_DIR="$candidate"
              break
            fi
          done
          if [ -z "${BROWSER_DIR:-}" ]; then
            echo "could not find any index.html under dist-regtest"
            ls -la dist-regtest || true
            tail -200 build.log || true
            exit 1
          fi
          echo "BROWSER_DIR=$BROWSER_DIR" >> "$GITHUB_ENV"

      - name: Serve the static bundle on the slot's app port
        run: |
          nohup npx -y serve@14 -s "$BROWSER_DIR" -l "$E2E_APP_PORT" --no-clipboard > serve.log 2>&1 &
          echo $! > serve.pid

      - name: Wait for the static server
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$E2E_APP_PORT/" 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then
              echo "static server up"; break
            fi
            if [ "$i" = "30" ]; then
              echo "static server never came up (last HTTP $code)"; tail -200 serve.log || true; exit 1
            fi
            sleep 1
          done

      - name: Install Playwright in the frontend tree
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the cat21-wallet regtest spec
        working-directory: frontend
        env:
          CAT21WALLET_EXT_PATH: ${{ github.workspace }}/sdk/e2e/extensions/cat21wallet
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24' \
            npx playwright test e2e/regtest/cat21wallet-mint.e2e.spec.ts \
            --config=playwright.regtest.config.ts

      # inscribe via cat21-wallet: the /inscribe half of the wallet's matrix.
      # Mock-free against the real ords (this workflow now brings them up).
      # cat21-wallet signs Leather-fork-generic, so no cat-specific dialog.
      - name: Run the page-driven inscribe regtest spec (CAT-21 wallet)
        if: always()
        working-directory: frontend
        env:
          CAT21WALLET_EXT_PATH: ${{ github.workspace }}/sdk/e2e/extensions/cat21wallet
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24' \
            npx playwright test e2e/regtest/inscribe-mint-cat21wallet.e2e.spec.ts \
            --config=playwright.regtest.config.ts

      # Nothing a spec's browser did may leave the runner: every launch was
      # offline (launchWalletContext), and the net logs prove it.
      - name: Check the net logs for requests that left the machine
        if: always()
        working-directory: frontend
        run: node node_modules/ordpool-sdk/scripts/check-net-log.mjs "$ORDPOOL_E2E_NET_LOG_DIR"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regtest-mint-cat21wallet-playwright-${{ github.run_id }}
          path: |
            frontend/test-results
            frontend/playwright-report-regtest
            build.log
            serve.log
            fees-stub.log
            net-log
          retention-days: 14
          if-no-files-found: warn

      - name: Dump container logs on failure
        if: failure()
        run: |
          for c in "$E2E_PREFIX-consumer-bitcoind" "$E2E_PREFIX-consumer-electrs" "$E2E_PREFIX-consumer-mariadb"; do
            echo "=== $c ==="
            docker logs "$c" 2>&1 | tail -200 || true
          done

      - name: Tear down stack
        if: always()
        run: |
          if [ -n "${E2E_SLOT:-}" ]; then
            node frontend/node_modules/ordpool-sdk/scripts/e2e-slots.mjs down "$E2E_SLOT" --force
          fi
          if [ -f fees-stub.pid ]; then
            kill "$(cat fees-stub.pid)" 2>/dev/null || true
          fi
          if [ -f serve.pid ]; then
            kill "$(cat serve.pid)" 2>/dev/null || true
          fi
