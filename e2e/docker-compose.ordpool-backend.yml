# OUR ordpool fork backend for the E2E regtest — layered on top of
# ordpool-sdk's consumer-environment compose (bitcoind + electrs + mariadb).
#
# NOT the upstream mempool/backend image: the fork adds the /api/* esplora
# proxy, /content + /preview inscription SSR, and the _ordpoolFlags. The
# image is built by build-ordpool-backend.sh (docker/init.sh + buildx, the
# same path .github/workflows/docker.yml uses — the fork Dockerfile needs
# GeoIP staged into backend/, which a plain compose build-context can't do).
# Run that script BEFORE bringing this up.
#
# Configured entirely via ENV VARS (the fork's start.sh substitutes them into
# mempool-config.json), so there's no host bind-mount to trip the macOS
# file-sharing quirk and no external config path to thread through.
#
# Brought up together with the base, inside a stack slot (its environment sets
# E2E_PREFIX and E2E_APP_BACKEND_PORT), via:
#   ./build-ordpool-backend.sh
#   node frontend/node_modules/ordpool-sdk/scripts/e2e-slots.mjs run --kind consumer -- \
#     frontend/node_modules/ordpool-sdk/e2e/consumer-environment-bootstrap.sh \
#       --extra-file "$PWD/e2e/docker-compose.ordpool-backend.yml"

services:

  ordpool-backend:
    image: ordpool-e2e-backend:local
    # Local-only image (built by build-ordpool-backend.sh); never pull.
    pull_policy: never
    # Named after the stack's slot prefix (E2E_PREFIX), like the SDK compose's
    # containers, so two slots' stacks never share a name.
    container_name: ${E2E_PREFIX:-ordpool-e2e}-backend
    depends_on:
      bitcoind:
        condition: service_healthy
      electrs:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    environment:
      MEMPOOL_BACKEND: "esplora"
      # NETWORK stays 'mainnet': the framework's NETWORK string controls UI
      # conventions, not the chain. bitcoind running -regtest answers all RPC
      # normally and the backend treats whatever it returns as the live chain.
      MEMPOOL_NETWORK: "mainnet"
      BACKEND_HTTP_PORT: "8999"
      MEMPOOL_SPAWN_CLUSTER_PROCS: "0"
      MEMPOOL_INDEXING_BLOCKS_AMOUNT: "0"
      MEMPOOL_CACHE_ENABLED: "false"
      MEMPOOL_AUTOMATIC_POOLS_UPDATE: "false"
      MEMPOOL_AUDIT: "false"
      MEMPOOL_RUST_GBT: "false"
      MEMPOOL_STDOUT_LOG_MIN_PRIORITY: "info"
      CORE_RPC_HOST: "bitcoind"
      CORE_RPC_PORT: "18443"
      CORE_RPC_USERNAME: "ordpool"
      CORE_RPC_PASSWORD: "ordpool"
      ESPLORA_REST_API_URL: "http://electrs:3000"
      DATABASE_ENABLED: "true"
      DATABASE_HOST: "mariadb"
      DATABASE_PORT: "3306"
      DATABASE_DATABASE: "mempool"
      DATABASE_USERNAME: "mempool"
      DATABASE_PASSWORD: "mempool"
    # The host side is the slot's app-backend port (E2E_APP_BACKEND_PORT,
    # ordpool-sdk e2e/stack-ports.ts); the container keeps BACKEND_HTTP_PORT.
    ports:
      - "${E2E_APP_BACKEND_PORT:?run inside a stack slot (ordpool-sdk scripts/e2e-slots.mjs)}:8999"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8999/api/v1/backend-info | grep -q . || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    # Wait for mariadb to fully accept connections before the backend tries
    # its first query — the healthcheck fires earlier than connection-ready.
    command: ["./wait-for-it.sh", "mariadb:3306", "--timeout=120", "--strict", "--", "./start.sh"]
